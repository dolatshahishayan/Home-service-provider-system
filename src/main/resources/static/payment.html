<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>پرداخت</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body { font-family: sans-serif; direction: rtl; margin: 2rem; }
        .timer { font-size: 1.5rem; color: red; margin-bottom: 1rem; }
        label { font-weight: bold; }
        input, select { width: 300px; padding: 0.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body>

<h2>فرم پرداخت</h2>

<div class="timer" id="timer">۱۰:۰۰</div>

<form id="paymentForm">
    <label>سفارش:</label><br>
    <label for="orderSelect"></label><select id="orderSelect" name="orderId" required>
        <option value="">سفارش را انتخاب کنید</option>
    </select><br>

    <label>شماره کارت:</label><br>
    <label>
        <input type="text" name="cardNumber" required>
    </label><br>

    <label>CVV2:</label><br>
    <label>
        <input type="text" name="cvv2" required>
    </label><br>

    <label>رمز دوم:</label><br>
    <label>
        <input type="password" name="otp" required>
    </label><br>

    <div class="g-recaptcha" data-sitekey="SITE_KEY_YOU_GET_FROM_GOOGLE"></div><br>

    <button type="submit">پرداخت</button>
</form>

<script>
    let timerElement = document.getElementById('timer');
    let timeLeft = 600;

    const interval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        timeLeft--;

        if (timeLeft < 0) {
            clearInterval(interval);
            alert("مهلت پرداخت به پایان رسید.");
            document.getElementById("paymentForm").querySelector("button").disabled = true;
        }
    }, 1000);

    async function loadOrders() {
        const res = await fetch("/api/v1/order/find-all-by-customer-id", { credentials: 'include' });
        if (!res.ok) {
            alert("عدم دریافت سفارش‌ها. لطفاً وارد حساب کاربری شوید.");
            return;
        }

        const orders = await res.json();
        const select = document.getElementById("orderSelect");

        orders.forEach(order => {
            const option = document.createElement("option");
            option.value = order.id;
            option.textContent = `سفارش ${order.id} - مبلغ: ${order.finalPrice}`;
            select.appendChild(option);
        });
    }

    loadOrders();

    document.getElementById("paymentForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        if (timeLeft <= 0) {
            alert("مهلت پرداخت تمام شده است.");
            return;
        }

        const token = grecaptcha.getResponse();
        if (!token) {
            alert("لطفاً reCAPTCHA را تکمیل کنید.");
            return;
        }

        const formData = new FormData(e.target);
        const payload = {
            orderId: formData.get("orderId"),
            cardNumber: formData.get("cardNumber"),
            cvv2: formData.get("cvv2"),
            otp: formData.get("otp"),
            recaptcha: token,
            clientTimeLeft: timeLeft
        };

        const response = await fetch("/api/v1/wallet/pay-from-wallet", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            alert("پرداخت موفقیت‌آمیز بود.");
        } else {
            const error = await response.text();
            alert("خطا در پرداخت: " + error);
        }
    });
</script>

</body>
</html>
