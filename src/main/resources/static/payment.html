<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>شارژ کیف پول با reCAPTCHA v3</title>

    <script src="https://www.google.com/recaptcha/api.js?render=6LcWs34rAAAAAGeYuBlMjOzjyQ9gVxkzCwVsh5rI"></script>
    <style>
        body { font-family: sans-serif; direction: rtl; margin: 2rem; }
        input { width: 300px; padding: 0.5rem; margin-bottom: 1rem; }
        .timer { font-size: 1.5rem; color: red; margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body>

<h2>فرم شارژ کیف پول</h2>

<div class="timer" id="timer">۱۰:۰۰</div>

<form id="paymentForm">
    <label>مبلغ شارژ (تومان):</label>
    <label>
        <input type="number" name="amount" required min="1000">
    </label>

    <label>شماره کارت:</label>
    <label>
        <input type="text" name="cardNumber" required>
    </label>

    <label>CVV2:</label>
    <label>
        <input type="text" name="cvv2" required>
    </label>

    <label>تاریخ انقضا (ماه/سال):</label>
    <label>
        <input type="month" name="expirationDate" required>
    </label>

    <label>رمز دوم:</label>
    <label>
        <input type="password" name="otp" required>
    </label>

    <button type="submit">شارژ کیف پول</button>
</form>

<script>
    let timerElement = document.getElementById('timer');
    let timeLeft = 600;
    let transactionId = null;

    const interval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        timeLeft--;
        if (timeLeft < 0) {
            clearInterval(interval);
            alert("مهلت پرداخت به پایان رسید.");
            document.getElementById("paymentForm").querySelector("button").disabled = true;
        }
    }, 1000);

    async function createTransaction() {
        const jwtToken = localStorage.getItem('token');
        if (!jwtToken) {
            alert("ابتدا وارد حساب کاربری شوید.");
            window.location.href = "/login.html";
            return;
        }

        try {
            const response = await fetch("/api/v1/transactions/save-initial-transaction", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + jwtToken
                }
            });

            if (response.ok) {
                const data = await response.json();
                transactionId = data.id;
            } else if (response.status === 401) {
                alert("دسترسی غیرمجاز! لطفاً وارد شوید.");
                localStorage.removeItem('token');
                window.location.href = "/login.html";
            } else {
                alert("خطا در شروع تراکنش");
            }
        } catch (err) {
            alert("خطا در ارتباط با سرور.");
        }
    }

    document.getElementById("paymentForm").addEventListener("submit", function (e) {
        e.preventDefault();

        if (timeLeft <= 0) {
            alert("مهلت پرداخت تمام شده است.");
            return;
        }

        if (!transactionId) {
            alert("خطا در اطلاعات پرداخت. لطفاً صفحه را دوباره بارگذاری کنید.");
            return;
        }

        const jwtToken = localStorage.getItem('token');

        grecaptcha.execute('6LcWs34rAAAAAGeYuBlMjOzjyQ9gVxkzCwVsh5rI', {action: 'submit'}).then(async function (recaptchaToken) {
            const formData = new FormData(e.target);
            const payload = {
                transactionId: transactionId,
                amount: parseFloat(formData.get("amount")),
                cardNumber: formData.get("cardNumber"),
                cvv2: formData.get("cvv2"),
                expirationDate: formData.get("expirationDate"),
                otp: formData.get("otp"),
                recaptcha: recaptchaToken,
                clientTimeLeft: timeLeft
            };

            try {
                const response = await fetch("/api/v1/wallets/add-credit-to-wallet", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + jwtToken
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("شارژ کیف پول با موفقیت انجام شد.");
                } else if (response.status === 401) {
                    alert("دسترسی غیرمجاز! لطفاً دوباره وارد شوید.");
                    localStorage.removeItem('token');
                    window.location.href = "/login.html";
                } else {
                    const error = await response.text();
                    alert("خطا در شارژ کیف پول: " + error);
                }
            } catch (err) {
                alert("خطا در ارتباط با سرور.");
            }
        });
    });

    window.addEventListener('load', createTransaction);
</script>

</body>
</html>
