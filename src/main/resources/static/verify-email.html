<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Email</title>
</head>
<body>
<h2>Verifying your email...</h2>
<div id="message"></div>

<script>
    function getTokenFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get('token');
    }

    function verifyEmail(token) {
        fetch('http://localhost:8080/api/v1/auth/verify-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
        })
            .then(response => {
                if (response.ok) {
                    document.getElementById('message').innerText = "✅ Email verified successfully!";
                } else {
                    return response.text().then(text => { throw new Error(text); });
                }
            })
            .catch(error => {
                document.getElementById('message').innerText = "❌ Verification failed: " + error.message;
            });
    }

    window.onload = function() {
        const token = getTokenFromURL();
        if (token) {
            verifyEmail(token);
        } else {
            document.getElementById('message').innerText = "❌ No verification token found.";
        }
    }
</script>
</body>
</html>
